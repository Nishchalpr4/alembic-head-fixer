<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">Before and after alembic-head-fixer</title>
  <desc id="d">Before: two merged pull requests both add migration 042 on top of 041, and alembic upgrade head fails with multiple heads. After: the later one is renumbered to 043 and chained after 042, and the upgrade runs.</desc>
  <style>
    .h { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: .08em; fill: #59636e; }
    .s { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #59636e; }
    .m { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #1f2328; }
    .ms { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #59636e; }
    .t { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #1f2328; }
    .bad { fill: #cf222e; }
    .good { fill: #1a7f37; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 2.5; }
    .node { fill: #0969da; }
  </style>

  <!-- before -->
  <rect x="8" y="8" width="464" height="314" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="36" y="46" class="h">BEFORE</text>
  <text x="104" y="46" class="s">two green PRs, both merged</text>
  <path class="edge" d="M70 135 C 140 135, 150 95, 214 95"/>
  <path class="edge" d="M70 135 C 140 135, 150 175, 214 175"/>
  <circle class="node" cx="70" cy="135" r="9"/>
  <text x="70" y="166" class="m" text-anchor="middle">041_users</text>
  <circle class="node" cx="220" cy="95" r="9"/>
  <text x="238" y="100" class="m">042_add_invoices</text>
  <text x="238" y="119" class="ms">PR #118 · merged</text>
  <circle class="bad" cx="220" cy="175" r="9"/>
  <text x="238" y="180" class="m">042_add_coupons</text>
  <text x="238" y="199" class="ms">PR #121 · merged</text>
  <rect x="28" y="222" width="424" height="80" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="254" class="t">$ alembic upgrade head</text>
  <text x="46" y="281" class="t bad">FAILED: Multiple head revisions are present</text>

  <!-- after -->
  <rect x="488" y="8" width="464" height="314" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="516" y="46" class="h">AFTER</text>
  <text x="574" y="46" class="s">alembic-head-fixer fix</text>
  <path class="edge" d="M540 135 H 840"/>
  <circle class="node" cx="540" cy="135" r="9"/>
  <text x="540" y="166" class="m" text-anchor="middle">041_users</text>
  <circle class="node" cx="690" cy="135" r="9"/>
  <text x="690" y="166" class="m" text-anchor="middle">042_add_invoices</text>
  <circle class="good" cx="840" cy="135" r="9"/>
  <text x="840" y="166" class="m" text-anchor="middle">043_add_coupons</text>
  <text x="840" y="186" class="ms good" text-anchor="middle">was 042 · merged second</text>
  <rect x="508" y="222" width="424" height="80" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="526" y="254" class="t">$ alembic upgrade head</text>
  <text x="526" y="281" class="t good">Running upgrade 042 -&gt; 043, add coupons ✓</text>
</svg>
